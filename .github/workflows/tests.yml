name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.3.4
          poetry install --with dev --no-root

      - name: Check dependency metadata and lock consistency
        run: |
          poetry check --lock
          poetry run python -m pip check

      - name: Run static and security checks
        if: matrix.python-version == '3.13'
        run: |
          poetry run ruff check src tests scripts
          poetry run ruff format --check src tests scripts
          poetry run bandit -q -r src scripts -x src/legacy
          poetry run pip-audit --local --skip-editable

      - name: Run unit, integration, and Streamlit app tests
        run: >-
          poetry run python -m pytest -m "not e2e" -q
          --cov=src --cov-report=term-missing --cov-fail-under=80

  windows:
    name: Windows startup and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.3.4
          poetry install --with dev --no-root

      - name: Validate Windows launcher preflight
        shell: pwsh
        run: |
          .\start_app.ps1 -PreflightOnly -PythonPath (Get-Command python).Source

      - name: Run Windows unit and integration tests
        shell: pwsh
        run: poetry run python -m pytest -m "not e2e" -q

  browser-e2e:
    name: Chromium end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.3.4
          poetry install --with dev --no-root

      - name: Install Chromium
        run: poetry run python -m playwright install --with-deps --only-shell chromium

      - name: Run browser end-to-end test
        run: poetry run python -m pytest -m e2e -q

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure
          path: output/playwright/
          if-no-files-found: warn
          retention-days: 7
